[package]
name = "inverter-desktop-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
inverter-worker-protocol = { path = "../desktop-plugins/worker-protocol" }
inverter-camera-common = { path = "../desktop-plugins/camera-common" }
serde_json = "=1.0.151"

[[bin]]
name = "worker_frames"
path = "fuzz_targets/worker_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "camera_topics"
path = "fuzz_targets/camera_topics.rs"
test = false
doc = false
bench = false

[[bin]]
name = "live_urls"
path = "fuzz_targets/live_urls.rs"
test = false
doc = false
bench = false
