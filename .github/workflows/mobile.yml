name: Mobile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios
      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Init iOS project
        env:
          SERVER_ADDR_FILE: ''
        run: pnpm tauri ios init --ci
      - name: Ensure Archive config is Release
        run: |
          SCHEME="src-tauri/gen/apple/inverter-dashboard.xcodeproj/xcshareddata/xcschemes/inverter-dashboard_iOS.xcscheme"
          # Tauri may generate ArchiveAction with debug; force release
          sed -i.bak 's/buildConfiguration = "debug"/buildConfiguration = "release"/g' "$SCHEME"
          rm -f "$SCHEME.bak"
          echo "✓ Archive action set to release"
      - name: Disable code signing in Xcode project
        run: |
          python3 -c "
          import re
          p = 'src-tauri/gen/apple/inverter-dashboard.xcodeproj/project.pbxproj'
          with open(p) as f:
              c = f.read()
          c = re.sub(r'DEVELOPMENT_TEAM\s*=\s*\"[^\"]*\";', '', c)
          c = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*\"[^\"]*\";', 'CODE_SIGN_IDENTITY = \"-\";', c)
          # Remove any existing entries first (idempotent)
          c = re.sub(r'\n\s*CODE_SIGNING_ALLOWED\s*=\s*(YES|NO);', '', c)
          c = re.sub(r'\n\s*CODE_SIGNING_REQUIRED\s*=\s*(YES|NO);', '', c)
          # Add fresh entries after each SDKROOT = iphoneos;
          c = re.sub(r'(SDKROOT = iphoneos;)',
              r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;', c)
          with open(p, 'w') as f:
              f.write(c)
          print('Code signing disabled')
          "
      - name: Configure git for non-interactive GitHub clones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add safe.directory $PWD

      - name: Pre-build Rust library for iOS
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --target aarch64-apple-ios --release \
            --package inverter-dashboard --lib \
            --manifest-path src-tauri/Cargo.toml
          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp src-tauri/target/aarch64-apple-ios/release/libinverter_dashboard_lib.a \
            src-tauri/gen/apple/Externals/arm64/release/libapp.a

      - name: Patch Xcode build phase to skip xcode-script if lib exists
        run: python3 scripts/patch_pbxproj.py

      - name: Sync IPHONEOS_DEPLOYMENT_TARGET with installed SDK
        run: |
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          PBPROJ="src-tauri/gen/apple/inverter-dashboard.xcodeproj/project.pbxproj"
          sed -i.bak "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${SDK_VERSION};/" "$PBPROJ"
          rm -f "$PBPROJ.bak"
          echo "✓ Deployment target set to $SDK_VERSION"

      - name: Build iOS (unsigned .app)
        env:
          TAURI_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Clean + custom DerivedData to avoid stale debug caches
          rm -rf "src-tauri/gen/apple/build/DerivedData"
          xcodebuild clean archive \
            -project "src-tauri/gen/apple/inverter-dashboard.xcodeproj" \
            -scheme "inverter-dashboard_iOS" \
            -sdk iphoneos \
            -configuration release \
            -archivePath "src-tauri/gen/apple/build/InverterDashboard.xcarchive" \
            -derivedDataPath "src-tauri/gen/apple/build/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64

      - name: Package .ipa
        run: |
          XCA="src-tauri/gen/apple/build/InverterDashboard.xcarchive"
          APP_DIR="$XCA/Products/Applications"
          mkdir -p Payload
          cp -R "$APP_DIR/"*.app Payload/
          zip -qr "inverter-dashboard-ios.ipa" Payload
          rm -rf Payload
          echo "Created inverter-dashboard-ios.ipa"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inverter-dashboard-ios-v${{ steps.version.outputs.version }}
          path: inverter-dashboard-ios.ipa

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install required Android SDK components (compileSdk 36, build-tools 34.0.0)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "platform-tools" 2>&1 | tail -5
          echo "✓ Android SDK components installed"
      - name: Get version
        id: version
        run: echo "version=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Init Android project
        run: pnpm tauri android init --ci
      - name: Build Android
        run: pnpm tauri android build --ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inverter-dashboard-android-v${{ steps.version.outputs.version }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
