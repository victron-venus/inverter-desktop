name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI (with frontend)
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/rust-ci.yml@875762362bb31b4899bf02fdf9e835188dc5eb80
    with:
      enable-frontend: true
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
