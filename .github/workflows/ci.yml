name: CI

on:
  workflow_call: {}
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI (with frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check release version ownership and native package validators
        run: |
          python3 scripts/version_plan.py check-base
          python3 -m unittest discover -s scripts -p 'test_*version*.py'
      - run: pnpm run format:check
      - name: Lint Vue, TypeScript and Tailwind CSS
        run: pnpm run lint
      - name: Typecheck Vue templates and build frontend
        run: |
          pnpm run test:build-profiles
          pnpm run test:mobile
          python3 -m unittest discover -s tests -p 'test_mobile_native_boundary.py'
          python3 -m unittest discover -s tests -p 'test_frigate_package.py'
          pnpm run build:mobile
          pnpm run build
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            src-tauri -> target
            desktop-plugins/frigate -> target
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev mosquitto
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Build the real Frigate worker package payload
        run: cargo build --release --locked --manifest-path desktop-plugins/frigate/Cargo.toml
      - name: Exercise a signed Frigate package against a private MQTT broker
        env:
          INVERTER_FRIGATE_WORKER: ${{ github.workspace }}/desktop-plugins/frigate/target/release/inverter-frigate-worker
          MOSQUITTO_BIN: /usr/sbin/mosquitto
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            plugins::frigate_integration_tests::signed_frigate_package_real_mqtt_lifecycle \
            -- --exact --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/frigate-integration.log"
          # A renamed/missing test must not turn acceptance into a zero-test pass.
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/frigate-integration.log"

  frigate-worker:
    name: Frigate worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: desktop-plugins/frigate -> target
      - run: cargo fmt --manifest-path desktop-plugins/frigate/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop-plugins/frigate/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path desktop-plugins/frigate/Cargo.toml --all-targets
      - run: cargo build --release --locked --manifest-path desktop-plugins/frigate/Cargo.toml
      - name: Stage the real worker and verify its target headers
        shell: bash
        run: |
          frigate_target="$(rustc -vV | sed -n 's/^host: //p')"
          frigate_suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then frigate_suffix=".exe"; fi
          python scripts/plugins/prepare-frigate-package.py \
            --worker "desktop-plugins/frigate/target/release/inverter-frigate-worker$frigate_suffix" \
            --target "$frigate_target" --output "$RUNNER_TEMP/frigate-package"

  windows-packages:
    name: Desktop package lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
      # File locks, replacement, executable cleanup, and path handling differ
      # from Unix. Exercise actual signed archives and child processes here.
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib plugins::'
      - run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example plugin-package -- --help
