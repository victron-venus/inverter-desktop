name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI (with frontend)
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/rust-ci.yml@ad8ccacd304eb2d941798572c59b9794830350af
    with:
      working-directory: src-tauri
      frontend-working-directory: .
      enable-frontend: true
      # Tauri v2 system libraries needed to compile *-sys crates on Linux
      apt-packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
