name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI (with frontend)
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/rust-ci.yml@main
    with:
      enable-frontend: true
