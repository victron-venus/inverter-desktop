name: CI
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  generate-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'scratch/biome-lock-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '10.34.4'
      - name: Record registry metadata and generate the locked update
        run: |
          npm view @biomejs/biome@2.6.3 version dist --json > biome-registry-metadata.json
          pnpm --version > pnpm-version.txt
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          test "$(pnpm exec biome --version)" = 'Version: 2.6.3'
          pnpm run lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: biome-2.6.3-lock
          if-no-files-found: error
          retention-days: 3
          path: |
            package.json
            pnpm-lock.yaml
            biome.json
            biome-registry-metadata.json
            pnpm-version.txt
