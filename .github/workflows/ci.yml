name: CI

on:
  workflow_call: {}
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI (with frontend)
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check release version ownership and native package validators
        run: |
          python3 scripts/version_plan.py check-base
          python3 -m unittest discover -s scripts -p 'test_*version*.py'
      - run: pnpm run format:check
      - name: Lint Vue, TypeScript and Tailwind CSS
        run: pnpm run lint
      - name: Typecheck Vue templates and build frontend
        run: |
          pnpm run test:build-profiles
          pnpm run test:mobile
          python3 -m unittest discover -s tests -p 'test_mobile_native_boundary.py'
          python3 -m unittest discover -s tests -p 'test_*package.py'
          pnpm run build:mobile
          pnpm run build
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            desktop-plugins/frigate -> target
            desktop-plugins/home-assistant -> target
            desktop-plugins/kerberos -> target
            desktop-plugins/ring -> target
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev mosquitto
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Check the opt-in native media acceptance executable
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --example plugin-media-smoke --features native-media-smoke -- -D warnings
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example plugin-media-smoke --features native-media-smoke -- --help
      - name: Build the real Frigate worker package payload
        run: cargo build --release --locked --manifest-path desktop-plugins/frigate/Cargo.toml
      - name: Build the real Home Assistant worker package payload
        run: cargo build --release --locked --manifest-path desktop-plugins/home-assistant/Cargo.toml
      - name: Build the real Kerberos and Ring worker payloads
        run: |
          cargo build --release --locked --manifest-path desktop-plugins/kerberos/Cargo.toml
          cargo build --release --locked --manifest-path desktop-plugins/ring/Cargo.toml
      - name: Verify acceptance runner contracts with real Cargo
        run: python3 -m unittest discover -s tests -p 'test_ci_acceptance_runner.py'
      - name: Exercise all 13 isolated signed-package acceptance scenarios
        env:
          INVERTER_FRIGATE_WORKER: ${{ github.workspace }}/desktop-plugins/frigate/target/release/inverter-frigate-worker
          INVERTER_HOME_ASSISTANT_WORKER: ${{ github.workspace }}/desktop-plugins/home-assistant/target/release/inverter-home-assistant-worker
          INVERTER_KERBEROS_WORKER: ${{ github.workspace }}/desktop-plugins/kerberos/target/release/inverter-kerberos-worker
          INVERTER_RING_WORKER: ${{ github.workspace }}/desktop-plugins/ring/target/release/inverter-ring-worker
          MOSQUITTO_BIN: /usr/sbin/mosquitto
        run: python3 scripts/run-ci-acceptance.py

  apple-tls:
    name: Apple TLS trust regressions
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      # The Apple verifier cannot run on Linux. iOS compilation and packaging
      # remain covered by Mobile; this job checks native trust failure modes.
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tls
      - name: Set up Python for isolated Apple TLS probes
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify Apple native TLS key policy
        shell: bash
        run: |
          DESKTOP_TLS_PYTHON="$(python -c 'import sys; sys.stdout.write(sys.executable)')"
          export DESKTOP_TLS_PYTHON
          DESKTOP_TLS_OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          export DESKTOP_TLS_OPENSSL
          export DESKTOP_TLS_PROBE_OUTPUT_DIR="$RUNNER_TEMP/tls-policy-apple-native"
          python -c 'import os; from pathlib import Path; assert not Path(os.environ["DESKTOP_TLS_PROBE_OUTPUT_DIR"]).exists(), "stale probe output"'
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tls_key_policy -- --ignored --nocapture
          python -c 'import json, os; from pathlib import Path; p=Path(os.environ["DESKTOP_TLS_PROBE_OUTPUT_DIR"]); reports=[json.loads((p/(n+".json")).read_text()) for n in ["plugin-download", "video-transfer"]]; assert all(r["profile"] == "apple-rsa-pkcs1-ecdsa" and len(r["observations"]) == 10 for r in reports)'
      - name: Upload Apple native TLS probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-policy-native-macos
          path: ${{ runner.temp }}/tls-policy-apple-native/*.json
          if-no-files-found: error

  desktop-workers:
    name: ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        plugin: [frigate, home-assistant, kerberos, ring, camera-common, worker-protocol]
        include:
          - plugin: frigate
            name: Frigate worker
            binary: inverter-frigate-worker
          - plugin: home-assistant
            name: Home Assistant worker
            binary: inverter-home-assistant-worker
          - plugin: worker-protocol
            name: Worker protocol
            binary: ''
          - plugin: kerberos
            name: Kerberos worker
            binary: inverter-kerberos-worker
          - plugin: ring
            name: Ring worker
            binary: inverter-ring-worker
          - plugin: camera-common
            name: Camera MQTT transport
            binary: ''
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop-plugins/${{ matrix.plugin }} -> target
      - run: cargo fmt --manifest-path desktop-plugins/${{ matrix.plugin }}/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop-plugins/${{ matrix.plugin }}/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path desktop-plugins/${{ matrix.plugin }}/Cargo.toml --all-targets
      - name: Set up Python for isolated ha TLS probes
        if: matrix.plugin == 'home-assistant' && (runner.os == 'Windows' || runner.os == 'macOS')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify ha TLS key policy with disposable certificates
        if: matrix.plugin == 'home-assistant' && (runner.os == 'Windows' || runner.os == 'macOS')
        shell: bash
        run: |
          DESKTOP_TLS_PYTHON="$(python -c 'import sys; sys.stdout.write(sys.executable)')"
          DESKTOP_TLS_OPENSSL="$(python -c 'import shutil, sys; p = shutil.which("openssl"); sys.stdout.write(p or ""); sys.exit(p is None)')"
          export DESKTOP_TLS_PYTHON DESKTOP_TLS_OPENSSL
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            DESKTOP_TLS_OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          fi
          export DESKTOP_TLS_PROBE_OUTPUT_DIR="$RUNNER_TEMP/tls-policy-ha"
          python -c 'import os, subprocess; subprocess.run([os.environ["DESKTOP_TLS_OPENSSL"], "version"], check=True)'
          python -c 'import os; from pathlib import Path; assert not Path(os.environ["DESKTOP_TLS_PROBE_OUTPUT_DIR"]).exists(), "stale probe output"'
          cargo test --locked --manifest-path desktop-plugins/home-assistant/Cargo.toml tls_key_policy -- --ignored --nocapture
          python -c 'import json, os; from pathlib import Path; p=Path(os.environ["DESKTOP_TLS_PROBE_OUTPUT_DIR"]); names=["ha-rest"]; assert all((p/(n+".json")).is_file() for n in names); expected=10 if os.environ["RUNNER_OS"] == "macOS" else 12; assert all(len(json.loads((p/(n+".json")).read_text())["observations"]) == expected for n in names)'
      - name: Upload ha TLS probe evidence
        if: matrix.plugin == 'home-assistant' && (runner.os == 'Windows' || runner.os == 'macOS') && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-policy-ha-${{ runner.os == 'Windows' && 'windows' || 'macos' }}
          path: ${{ runner.temp }}/tls-policy-ha/*.json
          if-no-files-found: error
      - if: matrix.binary != ''
        run: cargo build --release --locked --manifest-path desktop-plugins/${{ matrix.plugin }}/Cargo.toml
      - name: Test worker package staging on the current platform
        if: matrix.binary != ''
        run: python -m unittest discover -s tests -p 'test_*package.py'
      - name: Stage the real worker and verify its target headers
        if: matrix.binary != ''
        shell: bash
        env:
          PLUGIN: ${{ matrix.plugin }}
          WORKER_BINARY: ${{ matrix.binary }}
        run: |
          worker_target="$(rustc -vV | sed -n 's/^host: //p')"
          worker_suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then worker_suffix=".exe"; fi
          python scripts/plugins/prepare-plugin-package.py --plugin "$PLUGIN" \
            --worker "desktop-plugins/$PLUGIN/target/release/$WORKER_BINARY$worker_suffix" \
            --target "$worker_target" --output "$RUNNER_TEMP/$PLUGIN-package"

  windows-packages:
    name: Desktop package lifecycle (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      # File locks, replacement, executable cleanup, and path handling differ
      # from Unix. Exercise actual signed archives and child processes here.
      - run: 'cargo test --locked --manifest-path src-tauri/Cargo.toml --lib plugins::'
      - name: Set up Python for isolated native TLS probes
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify native TLS key policy with disposable certificates
        shell: bash
        run: |
          DESKTOP_TLS_PYTHON="$(python -c 'import sys; sys.stdout.write(sys.executable)')"
          DESKTOP_TLS_OPENSSL="$(python -c 'import shutil, sys; p = shutil.which("openssl"); sys.stdout.write(p or ""); sys.exit(p is None)')"
          export DESKTOP_TLS_PYTHON DESKTOP_TLS_OPENSSL
          export DESKTOP_TLS_PROBE_OUTPUT_DIR="$RUNNER_TEMP/tls-policy-native"
          python -c 'import os, subprocess; subprocess.run([os.environ["DESKTOP_TLS_OPENSSL"], "version"], check=True)'
          python -c 'import os; from pathlib import Path; assert not Path(os.environ["DESKTOP_TLS_PROBE_OUTPUT_DIR"]).exists(), "stale probe output"'
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tls_key_policy -- --ignored --nocapture
          python -c 'import json, os; from pathlib import Path; p=Path(os.environ["DESKTOP_TLS_PROBE_OUTPUT_DIR"]); names=["plugin-download", "video-transfer"]; assert all((p/(n+".json")).is_file() for n in names); assert all(len(json.loads((p/(n+".json")).read_text())["observations"]) == 12 for n in names)'
      - name: Upload native TLS probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-policy-native-windows
          path: ${{ runner.temp }}/tls-policy-native/*.json
          if-no-files-found: error
      - run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example plugin-package -- --help
      - run: cargo run --locked --manifest-path src-tauri/Cargo.toml --example plugin-media-smoke --features native-media-smoke -- --help
