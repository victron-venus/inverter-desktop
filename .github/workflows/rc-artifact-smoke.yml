name: Published RC Linux smoke
'on':
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: rc-artifact-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  exact-linux-package:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/published-rc-linux-smoke' && github.event.pull_request.base.sha == '12cad7a2808688aa59195351a7ea74f491cb21ba'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Portable smoke contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -s tests -p test_rc_smoke.py -v
      - name: Install isolated software runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap xvfb dbus-x11 gnome-keyring \
            python3-gi python3-pil gir1.2-atspi-2.0 at-spi2-core imagemagick libwebkit2gtk-4.1-0 \
            libgtk-3-0 librsvg2-2 libappindicator3-1
      - name: Fetch and verify the fixed published RC artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/rc_smoke/prepare.py scripts/rc_smoke/binding.json "$RUNNER_TEMP/desktop-rc-package"
      - name: Render the actual package with no external network or host profile
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/rc_smoke/launch.py \
            "$RUNNER_TEMP/desktop-rc-package/prepared-binding.json" \
            "$RUNNER_TEMP/desktop-rc-package/package" "$RUNNER_TEMP/desktop-rc-evidence"
      - name: Retain bounded software acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exact-rc-linux-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-rc-evidence
          if-no-files-found: warn
          retention-days: 7
