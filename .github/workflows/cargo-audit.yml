name: Cargo Audit

on:
  workflow_call: {}
permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if Cargo files changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(\.github/workflows/cargo-audit\.yml|(src-tauri|desktop-plugins/[^/]+)/Cargo\.(toml|lock)|src-tauri/vendor/glib-0\.18\.5/.*)$'; then
              echo "any_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "any_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Harden the runner (Audit all outbound calls)
        if: steps.changed.outputs.any_changed == 'true'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.changed.outputs.any_changed == 'true'

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.changed.outputs.any_changed == 'true'
        with:
          workspaces: |
            src-tauri -> target
            desktop-plugins/frigate -> target
            desktop-plugins/home-assistant -> target
            desktop-plugins/kerberos -> target
            desktop-plugins/ring -> target
            desktop-plugins/camera-common -> target
            desktop-plugins/worker-protocol -> target

      - name: Install cargo-audit
        if: steps.changed.outputs.any_changed == 'true'
        run: cargo install cargo-audit --locked

      - name: Fetch dependencies
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: src-tauri
        # Ensures the local crates.io index matches Cargo.lock exactly before
        # auditing. Without this, a stale cached index (from rust-cache) can
        # cause cargo-audit to panic while building its dependency tree with
        # "invalid Cargo.lock dependency tree: Resolution(...)".
        # --locked is intentionally omitted: a stale restored rust-cache
        # registry can make even a plain fetch look like it needs to change
        # Cargo.lock, which --locked would then hard-fail on. Cargo.lock
        # itself is never modified by `cargo fetch` unless it is genuinely
        # incompatible with Cargo.toml.
        run: cargo fetch

      - name: Run cargo audit
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: src-tauri
        # The current lockfile no longer contains the former vulnerable
        # rustls-webpki/quick-xml versions. Do not retain stale advisory ignores.
        run: cargo audit

      - name: Audit the independent workers and shared protocol
        if: steps.changed.outputs.any_changed == 'true'
        # Host-only advisory exceptions do not apply to the separate workers.
        run: |
          for plugin in frigate home-assistant kerberos ring camera-common worker-protocol; do
            cargo fetch --locked --manifest-path "desktop-plugins/$plugin/Cargo.toml"
            cargo audit --file "desktop-plugins/$plugin/Cargo.lock"
          done

      - name: Skip (no Cargo changes)
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "No Cargo changes — audit skipped"
    timeout-minutes: 30
