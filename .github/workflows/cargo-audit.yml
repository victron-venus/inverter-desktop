name: Cargo Audit

on:
  workflow_call: {}
permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if Cargo files changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(\.github/workflows/cargo-audit\.yml|(src-tauri|desktop-plugins/[^/]+|fuzz|tests/glib-variant-regression)/Cargo\.(toml|lock)|src-tauri/vendor/glib-0\.18\.5/.*)$'; then
              echo "any_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "any_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Harden the runner (Audit all outbound calls)
        if: steps.changed.outputs.any_changed == 'true'
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.changed.outputs.any_changed == 'true'

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.changed.outputs.any_changed == 'true'
        with:
          workspaces: |
            src-tauri -> target
            desktop-plugins/frigate -> target
            desktop-plugins/home-assistant -> target
            desktop-plugins/kerberos -> target
            desktop-plugins/ring -> target
            desktop-plugins/camera-common -> target
            desktop-plugins/worker-protocol -> target

      - name: Install cargo-audit
        if: steps.changed.outputs.any_changed == 'true'
        run: cargo install cargo-audit --locked

      - name: Fetch dependencies
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: src-tauri
        # Fetch the committed graph. An audit must not silently resolve a
        # different lockfile when a restored registry cache is stale.
        run: cargo fetch --locked

      - name: Run cargo audit
        if: steps.changed.outputs.any_changed == 'true'
        working-directory: src-tauri
        # The current lockfile no longer contains the former vulnerable
        # rustls-webpki/quick-xml versions. Do not retain stale advisory ignores.
        run: cargo audit

      - name: Audit the independent workers and shared protocol
        if: steps.changed.outputs.any_changed == 'true'
        # Host-only advisory exceptions do not apply to the separate workers.
        run: |
          for plugin in frigate home-assistant kerberos ring camera-common worker-protocol; do
            cargo fetch --locked --manifest-path "desktop-plugins/$plugin/Cargo.toml"
            cargo audit --file "desktop-plugins/$plugin/Cargo.lock"
          done

      - name: Audit fuzz and native regression dependencies
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          for project in fuzz tests/glib-variant-regression; do
            cargo fetch --locked --manifest-path "$project/Cargo.toml"
            cargo audit --file "$project/Cargo.lock"
          done

      - name: Skip (no Cargo changes)
        if: steps.changed.outputs.any_changed != 'true'
        run: echo "No Cargo changes — audit skipped"
    timeout-minutes: 30
