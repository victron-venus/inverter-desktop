---
# Attach a source tarball to an EXISTING release only.
# Never create the GitHub Release here — that raced ahead of release.yml
# (tauri-action) and published v2.5.2 with notes but zero binaries.
name: Publish Release Assets

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Skip if release does not exist yet
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG not created yet — Release workflow owns creation; skipping source upload."
          fi

      - name: Create Release Archive
        if: steps.gate.outputs.exists == 'true'
        id: archive
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_NAME="inverter-desktop"
          ARCHIVE="${PKG_NAME}-${TAG}.tar.gz"
          mkdir -p "${PKG_NAME}"
          cp -r src package.json tsconfig.json vite.config.ts README.md LICENSE "${PKG_NAME}/" 2>/dev/null || true
          tar -czf "$ARCHIVE" "${PKG_NAME}/"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload source archive to existing release
        if: steps.gate.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" "${{ steps.archive.outputs.ARCHIVE }}" --clobber
