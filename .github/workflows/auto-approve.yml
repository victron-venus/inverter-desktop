name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'

'on':
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@c134cccf4161025ca1b1c180874dd30aa550c278
    # BOT_PAT must be forwarded explicitly (reusable workflows receive
    # no secrets by default). Without the secret the step skips cleanly.
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
