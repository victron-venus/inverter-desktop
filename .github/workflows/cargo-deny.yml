name: Cargo Security Audit

on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  cargo-deny:
    permissions:
      contents: read
      security-events: write
    name: Cargo Deny Check
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cache/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.20.2-${{ hashFiles('src-tauri/cargo-deny.toml') }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-deny-${{ runner.os }}-0.20.2-

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-deny --version 0.20.2 --locked --force

      - name: Install Python for the RustSec deferral guard
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run cargo deny check
        working-directory: src-tauri
        run: |
          cargo fetch --locked
          cargo deny --config cargo-deny.toml fetch all
          python3 ../scripts/check_rustsec_deferrals.py
          cargo deny --offline --locked --config cargo-deny.toml check advisories bans licenses sources

      - name: Generate SARIF report
        if: always()
        working-directory: src-tauri
        run: |
          mkdir -p target/deny
          cargo deny --offline --locked --config cargo-deny.toml --format sarif check advisories bans licenses sources > target/deny/cargo-deny.sarif || true

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: src-tauri/target/deny/cargo-deny.sarif
          category: cargo-deny
