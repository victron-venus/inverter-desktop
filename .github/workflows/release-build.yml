name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        description: Committed base version, without a v prefix or channel suffix
        required: true
        type: string
      channel:
        description: nightly, beta or rc; stable promotes existing RC bytes
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
defaults:
  run:
    shell: bash
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
            artifact: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
            artifact: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            target: ''
            artifact: ubuntu-22.04
          - platform: windows-latest
            args: ''
            target: ''
            artifact: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify committed release version
        run: python3 scripts/check-release-version.py "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Install frontend dependencies
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev
      - name: Install AppIndicator
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get install -y libappindicator3-dev
      - name: Build desktop installers
        run:
          if [ -n "$TAURI_TARGET" ]; then pnpm tauri build --ci --target "$TAURI_TARGET"; else pnpm tauri build
          --ci; fi
        env:
          TAURI_TARGET: ${{ matrix.target }}
          TAURI_APP_VERSION: ${{ inputs.version }}
      - name: Collect desktop installers
        run: python3 scripts/collect-release-desktop.py
        env:
          TAURI_TARGET: ${{ matrix.target }}
      - name: Store release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-desktop-${{ matrix.artifact }}
          path: release-output/desktop/*
          if-no-files-found: error
          retention-days: 14
    timeout-minutes: 90
  mobile:
    name: Build mobile artifacts
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            type: ios
          - platform: ubuntu-22.04
            type: android
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify committed release version
        run: python3 scripts/check-release-version.py "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets:
            ${{ matrix.type == 'ios' && 'aarch64-apple-ios' || 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android'
            }}
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test iOS package version validation
        if: matrix.type == 'ios'
        run: python3 -m unittest discover -s scripts -p test_ios_version.py
      - name: iOS – init project
        if: matrix.type == 'ios'
        env:
          SERVER_ADDR_FILE: ''
        run: pnpm tauri ios init --ci
      - name: iOS – ensure Archive config is Release
        if: matrix.type == 'ios'
        run: |
          SCHEME="src-tauri/gen/apple/inverter-dashboard.xcodeproj/xcshareddata/xcschemes/inverter-dashboard_iOS.xcscheme"
          sed -i.bak 's/buildConfiguration = "debug"/buildConfiguration = "release"/g' "$SCHEME"
          rm -f "$SCHEME.bak"
          echo "✓ Archive action set to release"
      - name: iOS – disable code signing
        if: matrix.type == 'ios'
        run: |
          python3 -c "
          import re
          p = 'src-tauri/gen/apple/inverter-dashboard.xcodeproj/project.pbxproj'
          with open(p) as f:
              c = f.read()
          c = re.sub(r'DEVELOPMENT_TEAM\s*=\s*\"[^\"]*\";', '', c)
          c = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*\"[^\"]*\";', 'CODE_SIGN_IDENTITY = \"-\";', c)
          # Remove any existing entries first (idempotent)
          c = re.sub(r'\n\s*CODE_SIGNING_ALLOWED\s*=\s*(YES|NO);', '', c)
          c = re.sub(r'\n\s*CODE_SIGNING_REQUIRED\s*=\s*(YES|NO);', '', c)
          # Add fresh entries after each SDKROOT = iphoneos;
          c = re.sub(r'(SDKROOT = iphoneos;)',
              r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;', c)
          with open(p, 'w') as f:
              f.write(c)
          print('Code signing disabled')
          "
      - name: iOS – pre-build Rust library
        if: matrix.type == 'ios'
        run: |
          # Raw cargo does not run Tauri's beforeBuildCommand or enable the
          # production asset protocol; both are required before archiving.
          pnpm run build
          test -s dist/index.html
          cargo build --locked --target aarch64-apple-ios --release \
            --features tauri/custom-protocol \
            --package inverter-dashboard --lib \
            --manifest-path src-tauri/Cargo.toml
          mkdir -p src-tauri/gen/apple/Externals/arm64/release
          cp src-tauri/target/aarch64-apple-ios/release/libinverter_dashboard_lib.a \
            src-tauri/gen/apple/Externals/arm64/release/libapp.a
      - name: iOS – patch build phase to skip xcode-script
        if: matrix.type == 'ios'
        run: python3 scripts/patch_pbxproj.py
      - name: iOS – pin IPHONEOS_DEPLOYMENT_TARGET
        if: matrix.type == 'ios'
        run: |
          DEPLOYMENT_TARGET="26.0"
          PBPROJ="src-tauri/gen/apple/inverter-dashboard.xcodeproj/project.pbxproj"
          sed -i.bak "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = ${DEPLOYMENT_TARGET};/" "$PBPROJ"
          rm -f "$PBPROJ.bak"
          echo "✓ Deployment target set to $DEPLOYMENT_TARGET"
      - name: iOS – build (unsigned .app)
        if: matrix.type == 'ios'
        env:
          TAURI_APP_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/ios_version.py sync \
            src-tauri/gen/apple/inverter-dashboard_iOS/Info.plist --version "$TAURI_APP_VERSION"
          # Clean + custom DerivedData to avoid stale debug caches
          rm -rf "src-tauri/gen/apple/build/DerivedData"
          xcodebuild clean archive \
            -project "src-tauri/gen/apple/inverter-dashboard.xcodeproj" \
            -scheme "inverter-dashboard_iOS" \
            -sdk iphoneos \
            -configuration release \
            -archivePath "src-tauri/gen/apple/build/InverterDesktop.xcarchive" \
            -derivedDataPath "src-tauri/gen/apple/build/DerivedData" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64

          # Package .app into a sideload-ready .ipa
          XCA="src-tauri/gen/apple/build/InverterDesktop.xcarchive"
          APP_DIR="$XCA/Products/Applications"
          if [ ! -d "$APP_DIR" ]; then
            echo "No .app found in archive at $APP_DIR"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_DIR/"*.app Payload/
          # .ipa is a zip archive with Payload/ at the root
          zip -qr "${{ github.workspace }}/inverter-dashboard-ios.ipa" Payload
          rm -rf Payload
          python3 scripts/ios_version.py verify inverter-dashboard-ios.ipa --version "$TAURI_APP_VERSION"
          echo "Created inverter-dashboard-ios.ipa"
      - name: Store release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-mobile-ios
          path: inverter-dashboard-ios.ipa
          if-no-files-found: error
          retention-days: 14
        if: matrix.type == 'ios'
      - name: Android – setup Java
        if: matrix.type == 'android'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Android – setup SDK
        if: matrix.type == 'android'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Android – install required SDK components (compileSdk 36, build-tools 34.0.0)
        if: matrix.type == 'android'
        run: bash scripts/ci-android-install-sdk.sh
      - name: Android – init project
        if: matrix.type == 'android'
        run: pnpm tauri android init --ci
      - name: Android – build
        if: matrix.type == 'android'
        env:
          TAURI_APP_VERSION: ${{ inputs.version }}
        run: pnpm tauri android build --ci
      - name: Android – sign artifacts
        if: matrix.type == 'android' && github.repository_owner == 'victron-venus'
        env:
          SIGN_KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # r0adkll/sign-android-release@349ebde has no buildToolsVersion input
          # and hardcodes build-tools 29.0.3, which GitHub runners no longer
          # ship - the step died with "Couldnt find the Android build tools".
          # Sign inline with the 34.0.0 tools installed above; the output name
          # matches what the rename step below expects.
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          KS="$RUNNER_TEMP/signing.jks"
          printf '%s' "$SIGN_KEY_BASE64" | base64 -d > "$KS"

          # Secrets pasted into the GitHub UI often carry a trailing newline
          # or CR; a single stray byte makes key decryption fail with
          # BadPaddingException ("Given final block not properly padded").
          SIGN_KEY_STORE_PASSWORD="${SIGN_KEY_STORE_PASSWORD%$'\r'}"
          SIGN_KEY_STORE_PASSWORD="${SIGN_KEY_STORE_PASSWORD%$'\n'}"
          SIGN_KEY_PASSWORD="${SIGN_KEY_PASSWORD%$'\r'}"
          SIGN_KEY_PASSWORD="${SIGN_KEY_PASSWORD%$'\n'}"
          SIGN_KEY_ALIAS="${SIGN_KEY_ALIAS%$'\r'}"
          SIGN_KEY_ALIAS="${SIGN_KEY_ALIAS%$'\n'}"

          # Diagnose the keystore first: releases have shipped without an APK
          # since July because signing fails here silently.
          MAGIC=$(head -c 5 "$KS" | od -An -tx1 | tr -d ' \n')
          echo "Keystore magic: $MAGIC"   # feedfeed=JKS, 308204..=PKCS12
          case "$MAGIC" in
            feedfe*) STYPE=JKS ;;
            *)       STYPE=PKCS12 ;;
          esac

          # keytool exits non-zero on a wrong password/type while printing the
          # error on STDOUT - under set -e the assignment kills this step
          # silently unless the exit code is guarded (releases died here
          # invisibly since July). Secrets are auto-masked by Actions.
          if ! LIST=$(keytool -list -storetype "$STYPE" -keystore "$KS" -storepass "$SIGN_KEY_STORE_PASSWORD"); then
            echo "::warning::keytool -list exited non-zero; output:"
            echo "$LIST" | sed 's/[A-Za-z0-9+/=]\{20,\}/[masked]/g'
          fi
          if [ -z "$LIST" ]; then
            echo "::error::keystore listing empty; check ANDROID_KEYSTORE_* secrets"
            exit 1
          fi

          # Plain keytool -list (JKS and PKCS12 alike) prints one line per
          # entry: "<alias>, <date>, <EntryType>". Cut at the first comma.
          NAMES=$(echo "$LIST" | sed -n '/,/s/,.*//p')

          # Resolve alias + key password defensively.
          ALIAS="$SIGN_KEY_ALIAS"
          if ! printf '%s\n' "$NAMES" | grep -qixF -- "$ALIAS"; then
            ALIAS=$(printf '%s\n' "$NAMES" | head -1)
            echo "::notice::configured alias '$SIGN_KEY_ALIAS' not found; using keystore alias '$ALIAS'"
          fi
          if [ -z "$ALIAS" ]; then
            echo "::error::no alias resolved from listing:"
            echo "$LIST" | sed 's/[A-Za-z0-9+/=]\{20,\}/[masked]/g'
            exit 1
          fi
          export SIGN_KEY_PASS_FINAL="${SIGN_KEY_PASSWORD:-$SIGN_KEY_STORE_PASSWORD}"

          IN="$APK_DIR/app-universal-release-unsigned.apk"
          OUT="$APK_DIR/app-universal-release-unsigned-signed.apk"
          "$BT/zipalign" -f -p 4 "$IN" "$OUT.aligned"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "env:SIGN_KEY_STORE_PASSWORD" \
            --key-pass "env:SIGN_KEY_PASS_FINAL" \
            --out "$OUT" "$OUT.aligned" || { echo "apksigner failed"; exit 1; }
          "$BT/apksigner" verify "$OUT"
          echo "Signed: $OUT"
      - name: Android – rename artifacts for release
        if: matrix.type == 'android'
        run: |
          VERSION="${{ inputs.version }}"
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          AAB_DIR="src-tauri/gen/android/app/build/outputs/bundle/universalRelease"

          # Rename signed APK
          if [ -f "$APK_DIR/app-universal-release-unsigned-signed.apk" ]; then
            mv "$APK_DIR/app-universal-release-unsigned-signed.apk" "$APK_DIR/Inverter.Desktop_${VERSION}_signed.apk"
          fi

          # Rename AAB
          if [ -f "$AAB_DIR/app-universal-release.aab" ]; then
            mv "$AAB_DIR/app-universal-release.aab" "$AAB_DIR/Inverter.Desktop_${VERSION}.aab"
          fi
      - name: Collect Android packages
        if: matrix.type == 'android'
        run: |-
          mkdir -p release-output/android
          APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/Inverter.Desktop_${RELEASE_VERSION}_signed.apk"
          AAB="src-tauri/gen/android/app/build/outputs/bundle/universalRelease/Inverter.Desktop_${RELEASE_VERSION}.aab"
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" "$AAB" release-output/android/
      - name: Store release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-mobile-android
          path: release-output/android/*
          if-no-files-found: error
          retention-days: 14
        if: matrix.type == 'android'
