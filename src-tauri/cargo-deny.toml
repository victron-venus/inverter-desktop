[advisories]
db-urls = ["https://github.com/RustSec/advisory-db.git"]
db-path = "advisory-db"
# All of the entries below are unmaintained crates pulled in transitively by
# tauri (gtk-rs GTK3 bindings for Linux tray-icon support, and urlpattern's
# unic-* dependencies) or by ab_glyph (ttf-parser). None have a safe upgrade
# available upstream yet; tracked for removal once tauri/ab_glyph drop them.
ignore = [
    "RUSTSEC-2024-0416", # atk-sys: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0413", # atk: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0412", # gdk: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0418", # gdk-sys: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0411", # gdkwayland-sys: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0417", # gdkx11: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0414", # gdkx11-sys: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0415", # gtk: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0420", # gtk-sys: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0419", # gtk3-macros: gtk-rs GTK3 bindings unmaintained
    "RUSTSEC-2024-0370", # proc-macro-error: unmaintained (via glib-macros)
    "RUSTSEC-2026-0192", # ttf-parser: unmaintained (via ab_glyph)
    "RUSTSEC-2025-0081", # unic-char-property: unmaintained (via urlpattern)
    "RUSTSEC-2025-0075", # unic-char-range: unmaintained (via urlpattern)
    "RUSTSEC-2025-0080", # unic-common: unmaintained (via urlpattern)
    "RUSTSEC-2025-0100", # unic-ucd-ident: unmaintained (via urlpattern)
    "RUSTSEC-2025-0098", # unic-ucd-version: unmaintained (via urlpattern)
]

[bans]
deny = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
]
confidence-threshold = 0.8
include-dev = true

[sources]
allow-git = []
