[package]
name = "inverter-home-assistant-worker"
version = "0.4.0"
edition = "2021"
license = "MIT"
publish = false
description = "Standalone desktop Home Assistant state and selected action worker"

[workspace]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
inverter-worker-protocol = { path = "../worker-protocol" }
futures-util = "=0.3.34"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", features = ["json"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
url = "=2.5.8"

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dev-dependencies]
tokio-rustls = "=0.26.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
