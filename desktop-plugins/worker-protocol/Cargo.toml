[package]
name = "inverter-worker-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Bounded stdio transport for independently installed desktop workers"

[workspace]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["sync"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "macros", "time"] }
