[package]
name = "inverter-ring-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Standalone desktop Ring camera worker"

[workspace]

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
inverter-worker-protocol = { path = "../worker-protocol" }
inverter-camera-common = { path = "../camera-common" }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
uuid = { version = "=1.29.2", features = ["v4"] }
url = "=2.5.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
